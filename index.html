<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RENEZIA // Omicron-1</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- Сюда Phaser вставит canvas -->
        <!-- Окно диалога (HTML поверх игры) -->
        <div id="dialogue-overlay" style="display: none;">
            <div class="dialogue-box">
                <img id="dialogue-bg" src="images/dialogue-bg.png" alt="">
                <div class="dialogue-content">
                    <img id="dialogue-portrait" src="images/char-astra.png" alt="Астра">
                    <div class="dialogue-text-container">
                        <div id="dialogue-speaker">Астра Феретрей</div>
                        <div id="dialogue-text">...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
